<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cota 90 Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22><text y=%2226%22 font-size=%2226%22>🌿</text></svg>">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cota Tracker">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f17; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    .card { background-color: #151c28; border: 1px solid #222f42; }
  </style>
</head>
<body class="p-4 flex flex-col min-h-screen max-w-sm mx-auto select-none">
  
  <header class="text-center pt-3 pb-2">
    <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-950/60 border border-emerald-800/40 text-emerald-400 text-[11px] font-medium tracking-wide">
      <span>🌿</span> CONTROLE DE CONSUMO
    </div>
    <p class="text-xs text-slate-400 mt-2">Meta: 1 baseado por dia (Rollover)</p>
  </header>

  <!-- Card Principal: Saldo Disponível -->
  <div class="card rounded-2xl p-5 my-3 text-center shadow-xl">
    <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-widest">Saldo Disponível Hoje</span>
    <div id="saldoDisplay" class="text-6xl font-black my-2 tracking-tight">0</div>
    <div id="saldoStatus" class="text-xs font-medium px-3 py-1 rounded-full inline-block mt-1">Carregando...</div>
  </div>

  <!-- Botões de Ação -->
  <div class="flex flex-col gap-2 mb-4">
    <button onclick="fumarUm()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 transition-all text-white font-bold py-4 rounded-xl text-base shadow-lg shadow-emerald-950/50 flex items-center justify-center gap-2">
      <span class="text-xl">💨</span> +1 Fumei um baseado
    </button>
    <div class="flex justify-between px-1">
      <button onclick="desfazer()" class="text-xs text-slate-500 hover:text-slate-300 py-1 transition-colors">
        ↺ Desfazer último (+1)
      </button>
      <button onclick="ajustarManualmente()" class="text-xs text-slate-500 hover:text-slate-300 py-1 transition-colors">
        ⚙ Ajustar número
      </button>
    </div>
  </div>

  <!-- Métricas Rápidas -->
  <div class="grid grid-cols-2 gap-2.5 mb-4">
    <div class="card rounded-xl p-3 text-center">
      <span class="text-[11px] text-slate-400">Estoque Restante</span>
      <div id="estoqueDisplay" class="text-2xl font-bold text-slate-100 mt-0.5">84</div>
      <span class="text-[10px] text-slate-500">de 90 baseados</span>
    </div>
    <div class="card rounded-xl p-3 text-center">
      <span class="text-[11px] text-slate-400">Total Consumido</span>
      <div id="consumidoDisplay" class="text-2xl font-bold text-slate-100 mt-0.5">6</div>
      <span class="text-[10px] text-slate-500" id="diasDisplay">Dia 6 de controle</span>
    </div>
  </div>

  <!-- Barra de Consumo Total -->
  <div class="card rounded-xl p-3.5 mb-4">
    <div class="flex justify-between text-[11px] text-slate-400 mb-1.5 font-medium">
      <span>Consumo da Cota</span>
      <span id="percentualDisplay">6.7%</span>
    </div>
    <div class="w-full bg-slate-800/80 rounded-full h-2 overflow-hidden">
      <div id="progressBar" class="bg-emerald-500 h-2 rounded-full transition-all duration-500" style="width: 6.7%"></div>
    </div>
    <div class="flex justify-between text-[10px] text-slate-500 mt-2">
      <span>Início: 22/09/2026</span>
      <span id="previsaoFim">Previsão: ...</span>
    </div>
  </div>

  <footer class="mt-auto text-center text-[10px] text-slate-600 pb-2">
    Dados salvos localmente no seu celular
  </footer>

  <script>
    const CONFIG = {
      dataInicio: '2026-09-22',
      cotaTotal: 90
    };

    const STORAGE_KEY = 'cota_tracker_v1';
    let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
      fumados: 6,
      historico: []
    };

    function calcularDiasCorridos() {
      const agora = new Date();
      const ano = agora.getFullYear();
      const mes = String(agora.getMonth() + 1).padStart(2, '0');
      const dia = String(agora.getDate()).padStart(2, '0');
      const hojeStr = `${ano}-${mes}-${dia}`;
      
      const dInicio = new Date(`${CONFIG.dataInicio}T00:00:00`);
      const dHoje = new Date(`${hojeStr}T00:00:00`);
      
      const diffMs = dHoje - dInicio;
      const dias = Math.floor(diffMs / (1000 * 60 * 60 * 24)) + 1;
      return Math.max(1, dias);
    }

    function atualizarUI() {
      const dias = calcularDiasCorridos();
      const cotaLiberadaAteHoje = dias; // 1 por dia
      const saldo = cotaLiberadaAteHoje - state.fumados;
      const estoque = Math.max(0, CONFIG.cotaTotal - state.fumados);
      const pct = Math.min(100, ((state.fumados / CONFIG.cotaTotal) * 100)).toFixed(1);

      const saldoEl = document.getElementById('saldoDisplay');
      const statusEl = document.getElementById('saldoStatus');

      saldoEl.textContent = saldo;

      if (saldo > 0) {
        saldoEl.className = "text-6xl font-black my-2 tracking-tight text-emerald-400";
        statusEl.className = "text-xs font-semibold px-3 py-1 rounded-full inline-block bg-emerald-950/80 text-emerald-300 border border-emerald-800/50";
        statusEl.textContent = `Você tem ${saldo} liberado(s) para hoje! 🔥`;
      } else if (saldo === 0) {
        saldoEl.className = "text-6xl font-black my-2 tracking-tight text-slate-200";
        statusEl.className = "text-xs font-medium px-3 py-1 rounded-full inline-block bg-slate-800 text-slate-300";
        statusEl.textContent = "Cota de hoje atingida. Amanhã libera +1";
      } else {
        saldoEl.className = "text-6xl font-black my-2 tracking-tight text-rose-500";
        statusEl.className = "text-xs font-semibold px-3 py-1 rounded-full inline-block bg-rose-950/80 text-rose-300 border border-rose-800/50";
        statusEl.textContent = `Em débito de ${Math.abs(saldo)} dia(s). Segure a onda!`;
      }

      document.getElementById('estoqueDisplay').textContent = estoque;
      document.getElementById('consumidoDisplay').textContent = state.fumados;
      document.getElementById('diasDisplay').textContent = `Dia ${dias} de controle`;
      document.getElementById('percentualDisplay').textContent = `${pct}%`;
      document.getElementById('progressBar').style.width = `${pct}%`;

      // Previsão de término mantendo 1/dia
      const diasRestantes = estoque;
      const dataTermino = new Date();
      dataTermino.setDate(dataTermino.getDate() + diasRestantes);
      const diaFim = String(dataTermino.getDate()).padStart(2, '0');
      const mesFim = String(dataTermino.getMonth() + 1).padStart(2, '0');
      document.getElementById('previsaoFim').textContent = `Término estimado: ${diaFim}/${mesFim}`;

      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function fumarUm() {
      if (navigator.vibrate) navigator.vibrate(40);
      state.fumados += 1;
      state.historico.push(new Date().toISOString());
      atualizarUI();
    }

    function desfazer() {
      if (state.fumados > 0) {
        state.fumados -= 1;
        state.historico.pop();
        atualizarUI();
      }
    }

    function ajustarManualmente() {
      const valor = prompt("Qual o número exato de baseados fumados até agora?", state.fumados);
      if (valor !== null && !isNaN(valor) && valor.trim() !== "") {
        state.fumados = parseInt(valor, 10);
        atualizarUI();
      }
    }

    atualizarUI();
  </script>
</body>
</html>
