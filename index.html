<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cota Tracker</title>
  
  <!-- Ícones para iOS e Navegador -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cota Tracker">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0c0d12; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    .card { background-color: #161822; border: 1px solid #282a3a; }
  </style>
</head>
<body class="p-4 flex flex-col min-h-screen max-w-sm mx-auto select-none">
  
  <header class="text-center pt-3 pb-2">
    <div class="inline-flex items-center justify-center px-3 py-1 rounded-full bg-orange-950/70 border border-orange-700/50 text-orange-400 text-[11px] font-semibold tracking-wider">
      CONTROLE DE COTA
    </div>
    <p class="text-xs text-zinc-400 mt-2 font-medium">Meta: 11 de novembro</p>
  </header>

  <!-- Card Principal: Saldo Disponível -->
  <div class="card rounded-2xl p-5 my-3 text-center shadow-2xl relative overflow-hidden">
    <div class="absolute -top-10 -right-10 w-28 h-28 bg-orange-600/10 rounded-full blur-2xl pointer-events-none"></div>
    <span class="text-[11px] font-semibold text-zinc-400 uppercase tracking-widest">Saldo Disponível Hoje</span>
    <div id="saldoDisplay" class="text-6xl font-black my-2 tracking-tight">0</div>
    <div id="saldoStatus" class="text-xs font-semibold px-3 py-1 rounded-full inline-block mt-1">Carregando...</div>
  </div>

  <!-- Ação Principal -->
  <button onclick="fumarUm()" class="w-full bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 active:scale-95 transition-all text-white font-extrabold py-4 rounded-xl text-lg shadow-lg shadow-orange-950/60 flex items-center justify-center gap-2 mb-2">
    <span>💨</span> Subiu +1
  </button>

  <!-- Botões de Gestão Rápida -->
  <div class="grid grid-cols-3 gap-2 mb-4">
    <button onclick="desfazer()" class="py-2 px-1 rounded-lg bg-zinc-900 border border-zinc-800 text-[11px] font-medium text-zinc-400 hover:text-zinc-200 active:bg-zinc-800 transition-all text-center">
      ↺ Desfazer (+1)
    </button>
    <button onclick="presentear()" class="py-2 px-1 rounded-lg bg-orange-950/40 border border-orange-800/40 text-[11px] font-medium text-orange-300 hover:bg-orange-900/50 active:bg-orange-900/70 transition-all text-center">
      🎁 Presentear
    </button>
    <button onclick="abrirAjustes()" class="py-2 px-1 rounded-lg bg-zinc-900 border border-zinc-800 text-[11px] font-medium text-zinc-400 hover:text-zinc-200 active:bg-zinc-800 transition-all text-center">
      ⚙ Ajustes
    </button>
  </div>

  <!-- Métricas do Estoque -->
  <div class="grid grid-cols-2 gap-2.5 mb-4">
    <div class="card rounded-xl p-3 text-center">
      <span class="text-[11px] text-zinc-400 font-medium">Estoque Restante</span>
      <div id="estoqueDisplay" class="text-2xl font-bold text-zinc-100 mt-0.5">84</div>
      <span class="text-[10px] text-zinc-500" id="cotaTotalDisplay">de 90 total</span>
    </div>
    <div class="card rounded-xl p-3 text-center">
      <span class="text-[11px] text-zinc-400 font-medium">Total Consumido</span>
      <div id="consumidoDisplay" class="text-2xl font-bold text-zinc-100 mt-0.5">6</div>
      <span class="text-[10px] text-zinc-500" id="diasDisplay">Dia 6 de controle</span>
    </div>
  </div>

  <!-- Barra de Consumo e Previsões -->
  <div class="card rounded-xl p-3.5 mb-4">
    <div class="flex justify-between text-[11px] text-zinc-400 mb-1.5 font-medium">
      <span>Consumo da Cota</span>
      <span id="percentualDisplay">6.7%</span>
    </div>
    <div class="w-full bg-zinc-800/80 rounded-full h-2.5 overflow-hidden">
      <div id="progressBar" class="bg-gradient-to-r from-amber-500 to-orange-500 h-2.5 rounded-full transition-all duration-500" style="width: 6.7%"></div>
    </div>
    <div class="flex justify-between text-[10px] text-zinc-500 mt-2.5">
      <span>Início: 22/09/2026</span>
      <span id="presenteadosDisplay">Presenteados: 0</span>
    </div>
  </div>

  <footer class="mt-auto text-center text-[10px] text-zinc-600 pb-2">
    Armazenamento local • Sem nuvem
  </footer>

  <script>
    const CONFIG = {
      dataInicio: '2026-09-22'
    };

    const STORAGE_KEY = 'cota_tracker_v1';
    
    // Recupera dados preservando histórico se já existir
    let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    if (typeof state.fumados === 'undefined') state.fumados = 6;
    if (typeof state.cotaTotal === 'undefined') state.cotaTotal = 90;
    if (typeof state.presenteados === 'undefined') state.presenteados = 0;
    if (!Array.isArray(state.historico)) state.historico = [];

    function calcularDiasCorridos() {
      const agora = new Date();
      const ano = agora.getFullYear();
      const mes = String(agora.getMonth() + 1).padStart(2, '0');
      const dia = String(agora.getDate()).padStart(2, '0');
      const hojeStr = `${ano}-${mes}-${dia}`;
      
      const dInicio = new Date(`${CONFIG.dataInicio}T00:00:00`);
      const dHoje = new Date(`${hojeStr}T00:00:00`);
      
      const diffMs = dHoje - dInicio;
      const dias = Math.floor(diffMs / (1000 * 60 * 60 * 24)) + 1;
      return Math.max(1, dias);
    }

    function atualizarUI() {
      const dias = calcularDiasCorridos();
      const saldo = dias - state.fumados;
      const estoque = Math.max(0, state.cotaTotal - state.fumados);
      const baseCalculoTotal = state.cotaTotal + state.presenteados;
      const pct = baseCalculoTotal > 0 ? Math.min(100, ((state.fumados / baseCalculoTotal) * 100)).toFixed(1) : 0;

      const saldoEl = document.getElementById('saldoDisplay');
      const statusEl = document.getElementById('saldoStatus');

      saldoEl.textContent = saldo;

      if (saldo > 0) {
        saldoEl.className = "text-6xl font-black my-2 tracking-tight text-orange-400";
        statusEl.className = "text-xs font-semibold px-3 py-1 rounded-full inline-block bg-orange-950/80 text-orange-300 border border-orange-800/60";
        statusEl.textContent = `Você tem ${saldo} liberado(s) para hoje! 🔥`;
      } else if (saldo === 0) {
        saldoEl.className = "text-6xl font-black my-2 tracking-tight text-zinc-200";
        statusEl.className = "text-xs font-medium px-3 py-1 rounded-full inline-block bg-zinc-800 text-zinc-300";
        statusEl.textContent = "Cota de hoje atingida. Amanhã libera +1 ⏳";
      } else {
        saldoEl.className = "text-6xl font-black my-2 tracking-tight text-rose-500";
        statusEl.className = "text-xs font-semibold px-3 py-1 rounded-full inline-block bg-rose-950/80 text-rose-300 border border-rose-800/50";
        statusEl.textContent = `Em débito de ${Math.abs(saldo)} dia(s). Segure a onda! ⚠️`;
      }

      document.getElementById('estoqueDisplay').textContent = estoque;
      document.getElementById('cotaTotalDisplay').textContent = `de ${state.cotaTotal} total`;
      document.getElementById('consumidoDisplay').textContent = state.fumados;
      document.getElementById('diasDisplay').textContent = `Dia ${dias} de controle`;
      document.getElementById('percentualDisplay').textContent = `${pct}%`;
      document.getElementById('progressBar').style.width = `${pct}%`;
      document.getElementById('presenteadosDisplay').textContent = `Presenteados: ${state.presenteados}`;

      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function fumarUm() {
      if (navigator.vibrate) navigator.vibrate(40);
      state.fumados += 1;
      state.historico.push(new Date().toISOString());
      atualizarUI();
    }

    function desfazer() {
      if (state.fumados > 0) {
        state.fumados -= 1;
        state.historico.pop();
        atualizarUI();
      }
    }

    function presentear() {
      const input = prompt("Quantos baseados você deu de presente para alguém?", "1");
      if (input !== null) {
        const qtd = parseInt(input, 10);
        if (!isNaN(qtd) && qtd > 0) {
          if (state.cotaTotal >= qtd) {
            state.cotaTotal -= qtd;
            state.presenteados = (state.presenteados || 0) + qtd;
            alert(`🎁 ${qtd} baseado(s) deduzido(s) do total da cota com sucesso!`);
            atualizarUI();
          } else {
            alert("Quantidade maior que o total da cota!");
          }
        }
      }
    }

    function abrirAjustes() {
      const opcao = prompt(
        "O que deseja calibrar?\n1 - Alterar Cota Total (atualmente " + state.cotaTotal + ")\n2 - Alterar Fumados (atualmente " + state.fumados + ")", 
        "1"
      );

      if (opcao === "1") {
        const novoTotal = prompt("Digite o novo valor total da cota:", state.cotaTotal);
        if (novoTotal !== null && !isNaN(novoTotal) && novoTotal.trim() !== "") {
          state.cotaTotal = parseInt(novoTotal, 10);
          atualizarUI();
        }
      } else if (opcao === "2") {
        const novosFumados = prompt("Digite o total exato de baseados fumados:", state.fumados);
        if (novosFumados !== null && !isNaN(novosFumados) && novosFumados.trim() !== "") {
          state.fumados = parseInt(novosFumados, 10);
          atualizarUI();
        }
      }
    }

    atualizarUI();
  </script>
</body>
</html>
